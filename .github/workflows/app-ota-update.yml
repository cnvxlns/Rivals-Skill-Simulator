# JS/에셋만 바뀐 경우 OTA로 내보낸다. 친구들 앱은 재시작 시 자동 갱신된다.
# 네이티브 변경(새 Expo 모듈, 권한, SDK 업글)은 OTA로 전달되지 않는다.
# 그 경우 app-apk-build.yml을 수동 실행해 APK를 새로 만들어야 한다.
name: EAS Update (OTA)

on:
  push:
    branches: [deploy]
    paths:
      - 'app/src/**'
      - 'app/assets/**'
      - 'app/app.json'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish OTA update
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: eas update --channel preview --message "${{ github.event.head_commit.message || 'manual dispatch' }}" --non-interactive
