server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api를 같은 오리진에서 백엔드로 넘긴다. 이래서 앱 번들에 백엔드 주소를
    # 박을 필요도, CORS를 열 필요도 없다.
    # compose 네트워크의 서비스명으로 붙는다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 점수표는 전체 스킬을 한 번에 채점해 응답이 길어질 수 있다.
        proxy_read_timeout 120s;
    }

    # expo export는 정적 .html 파일을 낸다. vercel.json이 cleanUrls를 쓰므로
    # 확장자 없는 경로도 .html로 찾아본 뒤 SPA 폴백으로 넘긴다.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # 해시가 박힌 정적 자산은 오래 캐시해도 안전하다.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
