plugins {
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
    // 스프링 빈은 상속 가능해야 프록시가 만들어진다. 이 플러그인이 @Component 계열
    // 클래스와 메서드에 open을 붙여 준다. 코틀린 클래스는 기본이 final이다.
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.22'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

kotlin {
    jvmToolchain(17)
    compilerOptions {
        // JSR-305 어노테이션(@Nullable 등)을 코틀린 널 타입으로 엄격히 해석한다.
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 코틀린 data class를 기본 생성자로 역직렬화한다. 없으면 파라미터 이름을 못 읽는다.
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    // CSV 파싱
    implementation 'com.opencsv:opencsv:5.7.1'

    // 영속화. 사용자가 만든 것(계정, 덱)만 저장하며 스킬 데이터는 여전히 클래스패스 CSV가 원천이다.
    //
    // JPA가 아니라 평범한 JdbcTemplate을 쓴다. 코틀린 data class는 final이고 no-arg 생성자가
    // 없어 JPA를 쓰려면 kotlin-jpa/allopen 플러그인이 더 필요한데, SQL 몇 개를 돌리자고
    // 하이버네이트를 얹을 이유가 없다. 손으로 쓴 리포지토리 인터페이스 하나에 구현 하나라는
    // 기존 ScoreSkillRepository 관례와도 그대로 맞는다.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'

    // 비밀번호 해싱만 필요하다. spring-boot-starter-security를 넣으면 필터 체인 전체가 딸려와
    // 기존 공개 엔드포인트가 전부 막히고, 컨텍스트 없이는 테스트할 수도 없다.
    implementation 'org.springframework.security:spring-security-crypto'

    // JWT. 스프링 부트 BOM이 관리하지 않으므로 버전을 직접 적는다.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
