# 애플리케이션 프로퍼티
# 스킬 데이터의 원천은 클래스패스 CSV다. DB에는 사용자가 만든 것(계정, 덱)만 들어간다.
server.port=${PORT:8080}

# CORS 허용 출처. 쉼표 구분이며 환경변수 APP_CORS_ALLOWED_ORIGINS로 덮어쓸 수 있다.
# 개인 서버 전환 시 Cloudflare Tunnel 도메인을 여기에 추가한다.
app.cors.allowed-origins=http://localhost:8081,https://*.vercel.app

# --- 영속화 -----------------------------------------------------------------
# compose가 db 서비스를 띄우고 DB_* 를 넘긴다. 도커 없이 돌릴 때(make backend)는
# 로컬 5432를 본다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillsim}
spring.datasource.username=${DB_USER:skillsim}
spring.datasource.password=${DB_PASSWORD:skillsim}

# Flyway가 부팅 중에 스키마를 맞춘다. DB가 연결을 받지 못하면 컨텍스트가 뜨지 않는다.
spring.flyway.enabled=true

# --- 인증 -------------------------------------------------------------------
# 비워 두면 부팅 때 임의 키를 만들고 경고를 남긴다. 개발은 되지만 재시작할 때마다
# 기존 토큰이 무효가 되므로 운영에서는 반드시 채운다. HS256이라 32바이트 이상이어야 한다.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=${APP_JWT_TTL:P14D}
app.jwt.issuer=rivals-skill-sim
