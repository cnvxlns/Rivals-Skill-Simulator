# 로컬 개발 오버라이드.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# JDK 설치 없이 백엔드를 띄우고, 호스트에서 돌리는 Expo dev 서버(:8081)가
# http://localhost:8080 으로 붙게 한다. 기본 CORS 허용 목록에 localhost:8081이
# 이미 들어 있으므로 추가 설정은 필요 없다.
services:
  backend:
    ports:
      - '8080:8080'
    # 개발 중에는 죽은 컨테이너를 되살리지 않는다. 로그를 봐야 하기 때문이다.
    restart: 'no'
