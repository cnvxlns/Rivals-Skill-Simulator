# NCP 서버 운영 오버레이. Micro(1vCPU/1GB) 기준으로 맞춰져 있다.
#
#   docker compose -f docker-compose.yml -f docker-compose.ncp.yml pull backend
#   docker compose -f docker-compose.yml -f docker-compose.ncp.yml up -d
#
# -f 두 개를 반드시 명시한다. 생략하면 docker-compose.override.yml이 자동으로 얹혀
# 8080을 평문으로 호스트에 열고 restart 정책을 'no'로 되돌린다.
#
# 이 스택은 백엔드만 공개한다. 웹은 Vercel, 안드로이드는 EAS가 각각 배포하므로
# app(nginx)은 서버에서 띄우지 않는다. 같은 오리진이 아니게 되므로 .env의
# APP_CORS_ALLOWED_ORIGINS를 반드시 채운다 — compose 기본값은 localhost 하나뿐이라
# 비워 두면 배포 직후 앱 전체가 CORS로 막힌다.
#
# 이미지를 받으려면 서버에서 레지스트리에 한 번 로그인해 둔다.
#   docker login -u <Access Key ID> <레지스트리>.kr.ncr.ntruss.com
services:
  # 이미지는 GitHub Actions(.github/workflows/backend-image.yml)가 만들어 NCR에 올린다.
  # 1GB 서버에서는 Dockerfile의 test + bootJar가 OOM으로 죽어 직접 빌드할 수 없다.
  # build를 지우지 않으면 compose가 이미지가 없을 때 빌드로 떨어진다.
  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE 환경변수가 필요합니다}
    # Dockerfile의 -XX:MaxRAMPercentage=75.0은 '컨테이너 한도'를 기준으로 계산한다.
    # 한도를 주지 않으면 JVM이 호스트 1GB의 75%인 750MB를 힙 상한으로 잡아 db와 충돌한다.
    # 448m이면 힙 상한이 약 336MB다. 클래스패스 CSV는 전부 합쳐 208KB뿐이라 넉넉하다.
    mem_limit: 448m

  db:
    mem_limit: 256m
    # 기본 shared_buffers 128MB는 위 한도에 비해 과하다. max_connections도 낮춘다.
    # HikariCP 기본 풀이 10이라 20이면 남는다.
    command: postgres -c shared_buffers=64MB -c max_connections=20

  # 터널 대신 이 서버가 직접 TLS를 종단한다. Caddy가 Let's Encrypt 인증서를
  # 자동 발급하고 자동 갱신한다. NCP Certificate Manager의 무료 발급은 Global Edge
  # 전용이라 로드밸런서에 붙일 무료 인증서가 사실상 없고, LB를 두면 전용 LB 서브넷과
  # 공인 IP가 더 붙어 비용만 늘어난다.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80은 리다이렉트용이 아니라 Let's Encrypt HTTP-01 검증에 필요하다. 닫으면 갱신이 막힌다.
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 환경변수가 필요합니다}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 환경변수가 필요합니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서가 여기 산다. 지우고 다시 올리기를 반복하면
      # Let's Encrypt 발급 한도에 걸려 한동안 인증서를 못 받는다.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy

  app:
    # 프론트는 Vercel과 EAS가 배포한다. 프로필을 붙여 up 대상에서 뺀다.
    # 이렇게 해두면 올릴 서비스명을 일일이 적지 않아도 실수로 빌드되지 않는다.
    profiles: ['unused']

volumes:
  caddy_data:
  caddy_config:
