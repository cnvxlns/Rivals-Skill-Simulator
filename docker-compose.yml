# 프론트(Expo web) + 백엔드(Spring) 전체 스택.
#
#   로컬 개발   docker compose up --build
#               -> http://localhost:8081 하나로 끝. override 파일이 자동으로 얹힌다.
#
#   개인 서버   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#               -> override를 빼고 Cloudflare 터널만 붙인다. 호스트에 포트를 열지 않는다.
#
# app(nginx)이 정적 파일을 서빙하면서 /api만 backend로 프록시한다. 같은 오리진이라
# CORS 설정이 필요 없고, 앱 번들에 백엔드 주소를 박아 넣지도 않는다.
#
# 스킬 데이터는 여전히 클래스패스 CSV가 원천이고 DB에 넣지 않는다.
# DB에는 사용자가 만든 것(계정, 덱)만 들어간다 — 이 프로젝트의 유일한 상태다.
# 그래서 pgdata 볼륨은 지우면 안 된다. `make clean`은 볼륨을 건드리지 않으며,
# 정말로 지우려면 `make nuke`를 쓴다.
services:
  db:
    # postgres:16이 아닌 이유: 부트 3.2.4가 고정하는 Flyway 9.22.3이 PG16을 지원하지 않는다.
    # PG16 이상으로 올리려면 flyway-core 10.x와 flyway-database-postgresql 10.x를 함께 넣어야 한다.
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsim}
      POSTGRES_USER: ${POSTGRES_USER:-skillsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsim}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skillsim} -d ${POSTGRES_DB:-skillsim}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # nginx가 같은 오리진에서 프록시하므로 브라우저는 교차 출처 요청을 하지 않는다.
      # 이 값은 앱을 거치지 않고 백엔드를 직접 부르는 경우(개발 중 curl 등)를 위한 것이다.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skillsim}
      DB_USER: ${POSTGRES_USER:-skillsim}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-skillsim}
      # 비워 두면 부팅 때 임의 키를 만들고 경고를 남긴다. 재시작하면 기존 토큰이 무효가 되므로
      # 개인 서버에 올릴 때는 .env에 반드시 채운다.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
    expose:
      - '8080'
    # Flyway가 부팅 중에 돌기 때문에 DB가 연결을 받을 준비가 되어 있어야 컨텍스트가 산다.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  app:
    build: ./app
    restart: unless-stopped
    expose:
      - '80'
    # 백엔드가 뜨기 전에 nginx가 먼저 살아도 프록시가 502를 낸다.
    # 헬스체크 통과를 기다렸다가 올린다.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # localhost가 아니라 127.0.0.1이어야 한다. nginx.conf가 `listen 80;`만 두어
      # IPv4로만 대기하는데, 컨테이너 안에서 localhost는 ::1로 먼저 해석돼
      # connection refused가 난다. 백엔드는 JVM이 듀얼스택이라 걸리지 않았다.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 계정과 덱이 사는 곳. 이 프로젝트에서 유일하게 잃으면 복구할 수 없는 데이터다.
  pgdata:
