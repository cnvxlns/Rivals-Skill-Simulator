# 프론트(Expo web) + 백엔드(Spring) 전체 스택.
#
#   로컬 개발   docker compose up --build
#               -> http://localhost:8081 하나로 끝. override 파일이 자동으로 얹힌다.
#
#   개인 서버   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#               -> override를 빼고 Cloudflare 터널만 붙인다. 호스트에 포트를 열지 않는다.
#
# app(nginx)이 정적 파일을 서빙하면서 /api만 backend로 프록시한다. 같은 오리진이라
# CORS 설정이 필요 없고, 앱 번들에 백엔드 주소를 박아 넣지도 않는다.
#
# 백엔드는 클래스패스 CSV를 데이터 원천으로 쓰고 DB를 두지 않는다(application.properties).
# 상태가 없으므로 볼륨이 필요 없고, 컨테이너를 지우고 다시 만들어도 잃을 데이터가 없다.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # nginx가 같은 오리진에서 프록시하므로 브라우저는 교차 출처 요청을 하지 않는다.
      # 이 값은 앱을 거치지 않고 백엔드를 직접 부르는 경우(개발 중 curl 등)를 위한 것이다.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      PORT: 8080
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  app:
    build: ./app
    restart: unless-stopped
    expose:
      - '80'
    # 백엔드가 뜨기 전에 nginx가 먼저 살아도 프록시가 502를 낸다.
    # 헬스체크 통과를 기다렸다가 올린다.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # localhost가 아니라 127.0.0.1이어야 한다. nginx.conf가 `listen 80;`만 두어
      # IPv4로만 대기하는데, 컨테이너 안에서 localhost는 ::1로 먼저 해석돼
      # connection refused가 난다. 백엔드는 JVM이 듀얼스택이라 걸리지 않았다.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
