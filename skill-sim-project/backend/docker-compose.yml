# 개인 서버용 실행 스택.
#
# cloudflared가 백엔드를 Cloudflare 터널로 노출한다. 서버에서 바깥으로 나가는
# 연결만 사용하므로 공인 IP나 포트포워딩이 필요 없고, TLS는 Cloudflare가 종단한다.
# 백엔드 포트는 호스트에 열지 않는다(터널 내부에서만 접근).
services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      # 터널 도메인을 반드시 추가한다. 없으면 웹에서 CORS로 막힌다.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,https://*.vercel.app}
      PORT: 8080
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust 대시보드에서 발급한 터널 토큰.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 환경변수가 필요합니다}
    depends_on:
      backend:
        condition: service_healthy
